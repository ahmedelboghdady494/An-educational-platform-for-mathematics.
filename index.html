<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Academy | Grade 9 Advanced Math</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050816;
    color:#f8fafc;
    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    height:70px;
    background:#080d1c;
    border-bottom:1px solid #1e293b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    box-shadow:0 5px 25px rgba(0,0,0,.35);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}

.brand-logo{
    width:43px;
    height:43px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    font-size:22px;
    box-shadow:0 8px 25px rgba(99,102,241,.25);
}

.brand-text strong{
    display:block;
    font-size:17px;
}

.brand-text span{
    display:block;
    font-size:11px;
    color:#94a3b8;
    margin-top:2px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    border:1px solid #263249;
    background:#0d1426;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.icon-btn:hover{
    background:#151f35;
}

.profile-btn{
    display:flex;
    align-items:center;
    gap:9px;
    border:1px solid #29364f;
    background:#0d1426;
    color:#fff;
    padding:7px 11px;
    border-radius:14px;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(135deg,#22c55e,#2563eb);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.profile-name{
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* =========================
   LAYOUT
========================= */

.app{
    display:flex;
    min-height:calc(100vh - 70px);
}

.sidebar{
    width:245px;
    background:#070c19;
    border-right:1px solid #1c273b;
    padding:18px 13px;
    position:fixed;
    left:0;
    top:70px;
    bottom:0;
    overflow-y:auto;
}

.side-title{
    color:#64748b;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:12px 12px 8px;
}

.side-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#a8b3c7;
    padding:12px;
    border-radius:12px;
    text-align:left;
    margin-bottom:5px;
    display:flex;
    align-items:center;
    gap:11px;
    font-size:14px;
}

.side-btn:hover,
.side-btn.active{
    background:#111a2e;
    color:white;
}

.side-btn .ico{
    width:28px;
    text-align:center;
    font-size:17px;
}

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    padding:28px;
    max-width:1500px;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:300px;
    border:1px solid #25314a;
    border-radius:28px;
    padding:42px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 85% 20%,rgba(124,58,237,.25),transparent 28%),
        radial-gradient(circle at 10% 80%,rgba(37,99,235,.18),transparent 30%),
        #0a1020;
}

.hero:after{
    content:"∑  π  √  x²  ∞";
    position:absolute;
    right:30px;
    bottom:15px;
    color:rgba(255,255,255,.035);
    font-size:70px;
    font-weight:bold;
    letter-spacing:10px;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:750px;
}

.badge{
    display:inline-flex;
    padding:7px 12px;
    border-radius:20px;
    background:#121c35;
    border:1px solid #293a5c;
    color:#a5b4fc;
    font-size:12px;
    margin-bottom:17px;
}

.hero h1{
    font-size:clamp(32px,5vw,60px);
    line-height:1;
    margin-bottom:16px;
}

.gradient{
    background:linear-gradient(90deg,#a78bfa,#60a5fa,#22d3ee);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#a8b3c7;
    line-height:1.7;
    max-width:650px;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:11px;
    margin-top:24px;
}

.primary{
    border:0;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    padding:13px 19px;
    border-radius:12px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(37,99,235,.22);
}

.secondary{
    border:1px solid #2a3955;
    background:#0d1528;
    color:white;
    padding:13px 19px;
    border-radius:12px;
}

.primary:hover,
.secondary:hover{
    transform:translateY(-1px);
}

/* =========================
   SECTION
========================= */

.page-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.page-title h2{
    font-size:27px;
}

.page-title p{
    color:#7f8ca3;
    font-size:13px;
    margin-top:5px;
}

.back{
    border:1px solid #29364f;
    background:#0d1426;
    color:#cbd5e1;
    padding:9px 13px;
    border-radius:10px;
}

/* =========================
   TERM CARDS
========================= */

.term-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.term-card{
    min-height:210px;
    border:1px solid #26344e;
    background:#0b1222;
    border-radius:22px;
    padding:25px;
    position:relative;
    overflow:hidden;
    transition:.2s;
}

.term-card:hover{
    transform:translateY(-4px);
    border-color:#4c5f88;
}

.term-card.active-term{
    background:
        radial-gradient(circle at 100% 0%,rgba(124,58,237,.22),transparent 45%),
        #0b1222;
}

.term-card.disabled{
    opacity:.55;
}

.term-number{
    font-size:43px;
    font-weight:bold;
    color:#334155;
}

.term-card h3{
    margin-top:10px;
    font-size:22px;
}

.term-card p{
    color:#8391a7;
    font-size:13px;
    line-height:1.6;
    margin:8px 0 18px;
}

/* =========================
   FEATURE GRID
========================= */

.feature-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:22px;
}

.feature-card{
    background:#0b1222;
    border:1px solid #202d44;
    border-radius:18px;
    padding:20px;
}

.feature-card .big-icon{
    font-size:30px;
    margin-bottom:12px;
}

.feature-card h3{
    font-size:15px;
    margin-bottom:7px;
}

.feature-card p{
    color:#7f8ca3;
    font-size:12px;
    line-height:1.6;
}

/* =========================
   UNIT GRID
========================= */

.unit-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.unit-card{
    border:1px solid #25324a;
    background:#0a1120;
    border-radius:19px;
    padding:20px;
    transition:.2s;
}

.unit-card:hover{
    border-color:#52668f;
    transform:translateY(-2px);
}

.unit-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.unit-icon{
    width:52px;
    height:52px;
    border-radius:15px;
    background:#131e34;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.unit-info{
    flex:1;
}

.unit-info h3{
    font-size:17px;
}

.unit-info p{
    color:#75839b;
    font-size:12px;
    margin-top:5px;
}

.lesson-list{
    margin-top:17px;
    display:grid;
    gap:7px;
}

.lesson-item{
    width:100%;
    border:1px solid #202d43;
    background:#0e1729;
    color:#dbe4f0;
    border-radius:11px;
    padding:11px;
    text-align:left;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.lesson-item:hover{
    background:#152037;
}

.arrow{
    color:#64748b;
}

/* =========================
   DASHBOARD
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin:22px 0;
}

.stat{
    background:#0a1120;
    border:1px solid #202d44;
    border-radius:17px;
    padding:18px;
}

.stat-label{
    color:#718099;
    font-size:12px;
}

.stat-value{
    font-size:29px;
    font-weight:bold;
    margin-top:7px;
}

/* =========================
   LESSON PAGE
========================= */

.lesson-box{
    background:#0a1120;
    border:1px solid #26334b;
    border-radius:22px;
    padding:25px;
}

.lesson-header{
    display:flex;
    gap:16px;
    align-items:center;
    margin-bottom:23px;
}

.lesson-header-icon{
    width:65px;
    height:65px;
    border-radius:17px;
    background:linear-gradient(135deg,#172554,#312e81);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
}

.lesson-files{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.file-card{
    border:1px solid #25324a;
    background:#0e1729;
    padding:20px;
    border-radius:16px;
}

.file-card .file-icon{
    font-size:27px;
    margin-bottom:12px;
}

.file-card h4{
    margin-bottom:6px;
}

.file-card p{
    color:#77859c;
    font-size:12px;
    line-height:1.5;
    margin-bottom:15px;
}

.file-btn{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid #2d3b57;
    background:#111b30;
    color:white;
}

.file-btn:hover{
    background:#17243d;
}

/* =========================
   QUIZ BRANCHING
========================= */

.branch-path{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:18px;
}

.path{
    background:#111b2e;
    border:1px solid #293853;
    color:#94a3b8;
    border-radius:8px;
    padding:6px 9px;
    font-size:11px;
}

.quiz-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.quiz-card{
    background:#0a1120;
    border:1px solid #25324a;
    border-radius:18px;
    padding:20px;
}

.quiz-number{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#172554;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-bottom:13px;
}

.quiz-card h3{
    font-size:16px;
}

.quiz-card p{
    color:#78869d;
    font-size:12px;
    line-height:1.5;
    margin:8px 0 15px;
}

.quiz-card button{
    width:100%;
}

/* =========================
   QUIZ QUESTIONS
========================= */

.quiz-shell{
    max-width:850px;
    margin:auto;
}

.quiz-progress{
    height:8px;
    background:#172235;
    border-radius:10px;
    overflow:hidden;
    margin:15px 0 25px;
}

.quiz-progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#7c3aed,#2563eb);
    transition:.3s;
}

.question-card{
    background:#0a1120;
    border:1px solid #293650;
    border-radius:21px;
    padding:25px;
}

.question-number{
    color:#818cf8;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
}

.question-text{
    font-size:20px;
    line-height:1.5;
}

.answers{
    display:grid;
    gap:10px;
    margin-top:22px;
}

.answer{
    border:1px solid #2a3852;
    background:#0e1729;
    color:#dbe4f0;
    padding:14px;
    border-radius:12px;
    text-align:left;
}

.answer:hover{
    border-color:#61759d;
    background:#142039;
}

.answer.selected{
    border-color:#818cf8;
    background:#1b2442;
}

.quiz-controls{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:17px;
}

/* =========================
   PROGRESS
========================= */

.progress-list{
    display:grid;
    gap:11px;
}

.progress-row{
    background:#0a1120;
    border:1px solid #222f46;
    border-radius:15px;
    padding:16px;
}

.progress-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:9px;
}

.progress-head span:last-child{
    color:#a5b4fc;
    font-weight:bold;
}

.bar{
    height:8px;
    background:#172235;
    border-radius:10px;
    overflow:hidden;
}

.bar-fill{
    height:100%;
    background:linear-gradient(90deg,#22c55e,#3b82f6);
}

/* =========================
   REWARDS
========================= */

.reward-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.reward{
    background:#0a1120;
    border:1px solid #26334b;
    border-radius:18px;
    padding:21px;
    text-align:center;
}

.reward-icon{
    font-size:40px;
    margin-bottom:10px;
}

.reward p{
    color:#7f8ca3;
    font-size:12px;
    margin-top:6px;
}

/* =========================
   PROFILE PANEL
========================= */

.profile-panel{
    max-width:600px;
    margin:auto;
    background:#0a1120;
    border:1px solid #293650;
    border-radius:23px;
    padding:28px;
    text-align:center;
}

.profile-big{
    width:90px;
    height:90px;
    border-radius:50%;
    margin:0 auto 15px;
    background:linear-gradient(135deg,#7c3aed,#06b6d4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:bold;
}

.profile-panel p{
    color:#7f8ca3;
    margin:7px 0 20px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:#090f1d;
    border:1px solid #2b3852;
    border-radius:22px;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#121c2e;
    color:white;
    width:35px;
    height:35px;
    border-radius:9px;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    color:#94a3b8;
    font-size:12px;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

.input-wrap input{
    width:100%;
    background:#0d1628;
    border:1px solid #29364f;
    color:white;
    padding:13px 45px 13px 13px;
    border-radius:11px;
    outline:none;
}

.input-wrap input:focus{
    border-color:#6366f1;
}

.toggle-pass{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#94a3b8;
    padding:6px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:22px;
    right:22px;
    z-index:9000;
    background:#111827;
    border:1px solid #334155;
    color:white;
    padding:13px 17px;
    border-radius:12px;
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

.mobile-menu{
    display:none;
}

@media(max-width:1000px){

    .sidebar{
        width:210px;
    }

    .main{
        margin-left:210px;
        width:calc(100% - 210px);
    }

    .feature-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .quiz-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .reward-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:760px){

    .topbar{
        height:62px;
        padding:0 10px;
    }

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        width:100%;
        padding:15px;
    }

    .brand-text span{
        display:none;
    }

    .brand-text strong{
        font-size:14px;
    }

    .profile-name{
        display:none;
    }

    .profile-btn{
        padding:5px;
        border-radius:11px;
    }

    .mobile-menu{
        display:flex;
        width:40px;
        height:40px;
        border-radius:11px;
        border:1px solid #29364f;
        background:#0d1426;
        color:white;
        align-items:center;
        justify-content:center;
        font-size:20px;
    }

    .top-actions{
        gap:6px;
    }

    .hero{
        padding:27px 20px;
        min-height:350px;
        border-radius:21px;
    }

    .hero h1{
        font-size:38px;
    }

    .term-grid,
    .unit-grid,
    .lesson-files,
    .quiz-grid{
        grid-template-columns:1fr;
    }

    .feature-grid{
        grid-template-columns:1fr 1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .reward-grid{
        grid-template-columns:1fr 1fr;
    }

    .page-title{
        align-items:flex-start;
        flex-direction:column;
    }
}

@media(max-width:430px){

    .feature-grid,
    .stats,
    .reward-grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:32px;
    }

    .main{
        padding:11px;
    }
}

/* =========================================================
   AHMED ACADEMY FINAL ADDITIONS
========================================================= */

.header-profile{
    display:flex;
    align-items:center;
    gap:9px;
    border:1px solid #29364f;
    background:#0d1426;
    color:#fff;
    padding:7px 11px;
    border-radius:14px;
    cursor:pointer;
}

.header-profile:hover{background:#151f35;}

.header-profile-name{
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:700;
}

.teacher-dashboard-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
}

.teacher-panel{
    background:#0a1120;
    border:1px solid #26334b;
    border-radius:20px;
    padding:22px;
}

.teacher-panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}

.teacher-panel-head h3{margin:0;}
.teacher-panel-head p{margin:4px 0 0;color:#7f8ca3;font-size:12px;}

.teacher-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin:20px 0;
}

.teacher-stat{
    background:#0a1120;
    border:1px solid #202d44;
    border-radius:17px;
    padding:18px;
}

.teacher-stat strong{display:block;font-size:27px;margin-top:6px;}
.teacher-stat span{font-size:12px;color:#718099;}

.student-row,
.activity-row,
.result-row{
    border-bottom:1px solid rgba(255,255,255,.07);
}

.student-row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 0;
}

.student-row:last-child,
.activity-row:last-child,
.result-row:last-child{border-bottom:0;}

.student-info{flex:1;min-width:0;}
.student-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.student-info span{display:block;color:#718099;font-size:11px;margin-top:3px;}

.activity-row{
    display:flex;
    gap:11px;
    padding:12px 0;
}

.activity-icon{
    width:36px;
    height:36px;
    border-radius:11px;
    background:#111b30;
    display:flex;

/* =========================================================
   GRADE 9 ADVANCED TEXTBOOK-STYLE QUESTION ENGINE
========================================================= */

function mc(q, a, correct){
    return {q:q, a:a, c:correct};
}

function shuffleQuestions(list, seed){
    const out = list.slice();
    let x = (seed * 9301 + 49297) % 233280;
    for(let i=out.length-1;i>0;i--){
        x = (x * 9301 + 49297) % 233280;
        const j = Math.floor((x / 233280) * (i+1));
        [out[i],out[j]] = [out[j],out[i]];
    }
    return out;
}

function textbookQuestions(id, quizNo){

    const n = Math.max(1, Number(quizNo)||1);
    const k = n - 1;
    let q = [];

    /* Module 2 — Equations in One Variable */
    if(id === "2-1"){
        const x = 6+k;
        q = [
            mc(`A gym charges a ${x+4}-dollar registration fee plus $${x+2} per month. Which equation represents the total cost C after m months?`,[`C=${x+4}m+${x+2}`,`C=${x+2}m+${x+4}`,`C=${x+6}m`,`C=${x+4}+${x+2}`],1),
            mc(`The equation 4p+12=36 represents a situation. What does 12 represent if 4p is the variable cost?`,["the total cost","the fixed amount","the number of items","the rate of change"],1),
            mc(`Which equation represents “7 less than twice a number n is 19”?`,["2n-7=19","7-2n=19","2(n-7)=19","2n+7=19"],0),
            mc(`A taxi charges $5 plus $2 per mile. Which equation gives cost C for m miles?`,["C=5m+2","C=2m+5","C=7m","C=5(m+2)"],1),
            mc(`If 3x+8=29 models a situation, what does x represent?`,["the starting value","the fixed fee","the unknown quantity being measured","the total 29"],2),
            mc(`Which equation is equivalent to 6+3x=24?`,["3x=18","3x=30","6x=18","x=18"],0),
            mc(`A rectangle has width w and length w+5. Which expression represents its perimeter?`,["2w+5","4w+5","4w+10","2w+10"],2),
            mc(`Which statement correctly interprets y=12x+40?`,["40 is the rate and 12 is initial value","12 is the rate and 40 is initial value","12 is the total and 40 is rate","both are rates"],1),
            mc(`A quantity starts at 18 and increases by 4 each step. Which equation represents the quantity y after x steps?`,["y=18x+4","y=4x+18","y=22x","y=18-4x"],1),
            mc(`Which equation represents the statement “five times a number decreased by 9 is 31”?`,["5x+9=31","9-5x=31","5x-9=31","5(x-9)=31"],2)
        ];
    }

    if(id === "2-2"){

            mc("Causation means:",["one variable influences another","two variables are graphed","a line has slope","data are ordered"],0),
            mc("More exercise time and higher test scores may show:",["positive correlation, not automatically causation","negative correlation","no possible relationship","certain causation"],0),
            mc("A strong correlation alone proves causation:",["yes","no","only for positive data","only for linear data"],1),
            mc("A lurking variable is:",["another factor that may affect both variables","the y-intercept","the slope","a missing point"],0),
            mc("Which is an example of possible causation?",["studying more directly affects practice time","shoe size and test score always cause each other","ice cream sales cause temperature","two variables correlate so one must cause the other"],0),
            mc("To investigate causation, researchers should consider:",["experimental evidence and other factors","only the correlation coefficient","only the graph title","only the mean"],0),
            mc("If two variables have no correlation, then:",["there is no clear linear relationship","one causes the other","they are identical","the slope must be 1"],0),
            mc("A correlation of 0.85 indicates:",["strong positive association","strong negative association","no association","causation"],0),
            mc("A correlation of -0.88 indicates:",["strong negative association","strong positive association","no association","perfect causation"],0)
        ];
    }

    if(id === "5-5"){
        q = [
            mc("Linear regression finds:",["a best-fit linear model","an exact line through every point","only the median","a vertical line"],0),
            mc("A predicted value from a regression equation is:",["an estimate","always exact","a residual","the domain"],0),
            mc("If the regression equation is y=0.6x+2, predicted y for x=10 is:",["6","8","10","12"],1),
            mc("A residual is observed y minus:",["predicted y","x","slope","intercept"],0),
            mc("Residuals close to 0 indicate:",["small prediction errors","no data","strong negative correlation","a vertical line"],0),
            mc("A best-fit line should generally minimize:",["overall prediction error","the number of variables","the domain","the y-intercept"],0),
            mc("If a data point is above the regression line, its residual is:",["positive","negative","zero","undefined"],0),
            mc("If observed y=14 and predicted y=11, the residual is:",["-3","3","25","154"],1),
            mc("Using a model to estimate a value outside the observed x-range is called:",["extrapolation","interpolation","reflection","translation"],0),
            mc("Using a model between observed x-values is called:",["interpolation","extrapolation","dilation","causation"],0)
        ];
    }

    /* The uploaded lesson set currently contains 5-3, 5-4, 5-5. */
    return shuffleQuestions(q.length ? q : [
        mc(`Review question for ${id}: Which skill is emphasized in this lesson?`,["Use the lesson concepts and representations","Ignore the graph","Use unrelated arithmetic","Skip the context"],0),
        mc(`Which approach matches the Grade 9 Advanced textbook style for ${id}?`,["Interpret the mathematics in context","Guess without modeling","Use only mental arithmetic","Ignore units"],0)
    ], k+1).slice(0,10);
}

function getQuestions(unit,id){
    return textbookQuestions(id, quizNumber || 1);
}

function startQuiz(unit,id,title,number){

    logActivity("Started quiz", "Started quiz " + number + " for " + id);

    selectedUnit = unit;
    selectedLesson = id;

    quizNumber = number;
    quizQuestionIndex = 0;
    quizScore = 0;
    quizAnswers = [];

    renderQuestion(unit,id,title,number);
}


function renderQuestion(unit,id,title,number){

    const questions = getQuestions(unit,id);

    const q = questions[quizQuestionIndex];

    const percent =
        (quizQuestionIndex / questions.length) * 100;

    let answers = "";

    q.a.forEach((answer,index)=>{

        answers += `

            <button class="answer"
                onclick="selectAnswer(${index})"
                id="answer-${index}">

                ${String.fromCharCode(65+index)}.
                ${answer}

            </button>

        `;

    });


    document.getElementById("main").innerHTML = `

        <div class="quiz-shell">

            <div class="page-title">

                <div>

                    <button class="back"
                        onclick="openLessonQuizzes('${unit}','${id}','${title}')">
                        ← Exit Quiz
                    </button>

                    <h2 style="margin-top:15px">
                        Quiz ${number}
                    </h2>

                    <p>
                        ${unit} → ${id} — ${title}
                    </p>

                </div>

            </div>


            <div class="quiz-progress">

                <div class="quiz-progress-bar"
                    style="width:${percent}%">
                </div>

            </div>


            <div class="question-card">

                <div class="question-number">

                    QUESTION
                    ${quizQuestionIndex+1}
                    OF
                    ${questions.length}

                </div>

                <div class="question-text">
                    ${q.q}
                </div>

                <div class="answers">
                    ${answers}
                </div>

                <div class="quiz-controls">

                    <button class="secondary"
                        onclick="openLessonQuizzes('${unit}','${id}','${title}')">
                        Exit
                    </button>

                    <button class="primary"
                        onclick="nextQuestion('${unit}','${id}','${title}',${number})">
                        ${quizQuestionIndex === questions.length-1
                            ? "Finish Quiz"
                            : "Next →"}
                    </button>

                </div>

            </div>

        </div>
    `;
}


function selectAnswer(index){

    quizAnswers[quizQuestionIndex] = index;

    document
        .querySelectorAll(".answer")
        .forEach(x=>x.classList.remove("selected"));

    const el =
        document.getElementById("answer-"+index);

    if(el){
        el.classList.add("selected");
    }
}


function nextQuestion(unit,id,title,number){

    const questions = getQuestions(unit,id);

    if(quizAnswers[quizQuestionIndex] === undefined){

        toast("Please choose an answer first.");

        return;
    }


    if(
        quizAnswers[quizQuestionIndex]
        ===
        questions[quizQuestionIndex].c
    ){

        quizScore++;

    }


    if(quizQuestionIndex < questions.length-1){

        quizQuestionIndex++;

        renderQuestion(unit,id,title,number);

    }else{

        finishQuiz(unit,id,title,number);

    }
}


function finishQuiz(unit,id,title,number){

    const questions = getQuestions(unit,id);

    const percent =
        Math.round(
            (quizScore / questions.length) * 100
        );

    const key =
        `quiz_${unit}_${id}_${number}`;

    const result = {

        score:quizScore,
        total:questions.length,
        percent:percent,
        date:new Date().toLocaleString()

    };

    localStorage.setItem(
        key,
        JSON.stringify(result)
    );


    document.getElementById("main").innerHTML = `

        <div class="quiz-shell">

            <div class="question-card"
                 style="text-align:center">

                <div style="font-size:65px">
                    ${percent >= 80 ? "🏆" :
                      percent >= 50 ? "⭐" : "💪"}
                </div>

                <h2 style="margin-top:10px">
                    Quiz Complete!
                </h2>

                <p style="
                    color:#94a3b8;
                    margin-top:8px;
                ">
                    ${unit} → ${id} → Quiz ${number}
                </p>

                <div style="
                    font-size:45px;
                    font-weight:bold;
                    margin:25px 0 8px;
                ">
                    ${percent}%
                </div>

                <p style="color:#94a3b8">
                    Correct:
                    <strong>${quizScore}</strong>
                    /
                    ${questions.length}
                </p>

                <div style="
                    margin-top:24px;
                    display:flex;
                    justify-content:center;
                    flex-wrap:wrap;
                    gap:10px;
                ">

                    <button class="primary"
                        onclick="openLessonQuizzes('${unit}','${id}','${title}')">
                        Back to Quizzes
                    </button>

                    <button class="secondary"
                        onclick="startQuiz('${unit}','${id}','${title}',${number})">
                        Try Again
                    </button>

                    <button class="secondary"
                        onclick="showPage('progress')">
                        View Progress
                    </button>

                </div>

            </div>

        </div>
    `;

    logActivity("Completed quiz", "Quiz completed");
}

function getVisitorCount(){

function registerVisit(){
    const count = getVisitorCount() + 1;
    localStorage.setItem("aa_total_visits", String(count));
}

function getActivityLog(){
    try{
        return JSON.parse(localStorage.getItem("aa_activity_log") || "[]");
    }catch(e){
        return [];
    }
}

function saveActivityLog(log){
    localStorage.setItem("aa_activity_log", JSON.stringify(log));
}

function logActivity(action, details){
    if(!currentUser || currentUser === "Student") return;

    const log = getActivityLog();

    log.unshift({
        username: currentUser,
        action: action || "Activity",
        details: details || "",
        date: new Date().toLocaleString(),
        timestamp: Date.now()
    });

    if(log.length > 1000) log.length = 1000;

    saveActivityLog(log);
}

function getAvatarKey(username){
    return "aa_avatar_" + username;
}

function getAvatar(username){
    if(!username || username === "Student") return "";
    return localStorage.getItem(getAvatarKey(username)) || "";
}

function getAvatarHTML(username, size){
    size = size || 42;
    const image = getAvatar(username);

    if(image){
        return `
            <img
                src="${image}"
                alt="Profile"
                style="
                    width:${size}px;
                    height:${size}px;
                    border-radius:50%;
                    object-fit:cover;
                    display:block;
                "
            >

    }

    const letter = String(username || "A").charAt(0).toUpperCase();

    return `
        <div style="
            width:${size}px;
            height:${size}px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#22c55e,#2563eb);
            color:#fff;
            font-weight:800;
            font-size:${Math.max(14, size*.42)}px;
        ">${escapeHTML(letter)}</div>

function chooseProfilePhoto(){
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";

    input.onchange = function(){
        const file = this.files && this.files[0];
        if(!file) return;

        if(file.size > 2 * 1024 * 1024){
            toast("Please choose an image smaller than 2MB.");
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e){
            localStorage.setItem(
                getAvatarKey(currentUser),
                e.target.result
            );

            updateProfile();
            renderProfile();

            logActivity(
                "Updated profile",
                "Changed profile picture"
            );

            toast("Profile picture updated.");
        };

        reader.readAsDataURL(file);
    };

    input.click();
}

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeAttribute(value){
    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

function getAllResults(prefix){

    const results = [];

    for(let i=0;i<localStorage.length;i++){

        const key = localStorage.key(i);

        if(!key || !key.startsWith(prefix)) continue;

        try{
            const data = JSON.parse(localStorage.getItem(key));

            if(data){
                results.push({
                    key:key,
                    ...data
                });
            }
        }catch(e){}
    }

    return results.sort((a,b) =>
        (b.timestamp || new Date(b.date || 0).getTime()) -
        (a.timestamp || new Date(a.date || 0).getTime())
    );
}

function getActivityIcon(action){

    action = String(action || "");

    if(action.includes("Login")) return "🔐";
    if(action.includes("Opened lesson")) return "📘";
    if(action.includes("Opened PDF")) return "📄";
    if(action.includes("Started quiz")) return "📝";
    if(action.includes("Completed quiz")) return "✅";
    if(action.includes("Started challenge")) return "🔥";
    if(action.includes("Completed challenge")) return "🏆";
    if(action.includes("Daily")) return "☀️";
    if(action.includes("notes") || action.includes("Notes")) return "🗒️";
    if(action.includes("planner") || action.includes("Planner")) return "📅";
    if(action.includes("profile") || action.includes("Profile")) return "👤";

    return "📌";
}

function togglePassword(id,button){

    const input =

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁️";

    }

}
